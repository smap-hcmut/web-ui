apiVersion: v1
kind: Secret
metadata:
  name: smap-web-secret
  namespace: smap
  labels:
    app: smap-web
    component: frontend
type: Opaque
stringData:
  # Add your sensitive environment variables here
  # NEXT_PUBLIC_HOSTNAME: "https://smap-api.tantai.dev/identity"
  # API_KEY: "your-api-key"
  # DATABASE_URL: "your-database-url"
  PLACEHOLDER: "replace-with-actual-secrets"
